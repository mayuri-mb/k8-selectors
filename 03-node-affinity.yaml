apiVersion: v1
kind: Pod
metadata:
  name: nginx-affinity
  labels:
    env: test
spec:
  affinity:
    nodeAffinity:
      #Hard rule
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: topology.kubernetes.io/zone 
                operator: In 
                values:
                  - us-east-1c 
                  - us-east-1d
      #soft rule            
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
            - key: project
              operator: In  
              values: 
              - roboshop
        - weight: 1
          preference:
            matchExpressions:
            - key: project
              operator: In
              values:
              - amazon        
  containers:
    - name: nginx
      image: nginx                 
