apiVersion: v1
kind: Pod
metadata:
  name: pod1
  labels:
    tier: database
spec:
  containers:
    - name: nginx
      image: nginx     
---
apiVersion: v1
kind: Pod
metadata: 
  name: pod2
  labels:
    tier: backend
spec:
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: tier
              operator: NotIn
              values: 
                - database
        topologyKey: topology.kubernetes.io/zone         
  containers:
    - name: nginx
      image: nginx          
