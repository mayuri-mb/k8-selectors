apiVersion: v1
kind: Pod 
metadata:
  name: db
  labels:
    tier: database
spec:
  containers:
    - name: nginx
      image: nginx     
---
apiVersion: v1
kind: Pod
metadata:
  name: pod2
  labels:
    tier: backend
spec:
  affinity:
    podAffinity:
      #Hard rule
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: tier
              operator: In 
              values:
                - database
        topologyKey: topology.kubernetes.io/zone      
  containers:
    - name: nginx
      image: nginx                 
