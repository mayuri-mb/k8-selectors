apiVersion: v1
kind: Pod
metadata:
  name: nginx-anti-affinity
  labels:
    env: test
spec: 
  affinity:
    nodeAffinity:
      #HardRule
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
            - key: topology.kubernetes.io/zone 
              operator: In 
              values:
                - us-east-1d 
  containers:
    - name: nginx
      image: nginx                



